name: Data Warehouse & Lakehouse CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Unit Tests (Delta Lake ACID Protocol & Protocol Log)
      run: |
        python tests/test_delta_lake.py

    - name: Run Integration Tests (SQL Models & Schema Integrity)
      run: |
        python tests/test_sql_models.py

    - name: Run Data Marts Validation Tests (Operations, Finance, Product)
      run: |
        python tests/test_data_marts.py

    - name: Execute End-to-End Lakehouse & Warehouse Pipeline
      run: |
        python main.py
